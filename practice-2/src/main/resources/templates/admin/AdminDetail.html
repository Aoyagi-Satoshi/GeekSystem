<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<title>管理者詳細画面</title>
</head>

<body>
	<h1>管理者詳細画面</h1>

	<table border="1">
		<tr>
			<th>管理者ID</th>
			<td th:text="${admindetail.id}"></td>
		</tr>
		<tr>
			<th>名前</th>
			<td th:text="${admindetail.lastName +' '+ admindetail.firstName}"></td>
		</tr>
		<tr>
			<th>店舗名</th>
			<td th:text="${admindetail.storeName}"></td>
		</tr>
		<tr>
			<th>役職</th>
			<td th:text="${admindetail.roleName}"></td>
		</tr>
		<tr>
			<th>メールアドレス</th>
			<td th:text="${admindetail.email}"></td>
		</tr>
		<tr>
			<th>電話番号</th>
			<td th:text="${admindetail.phone}"></td>
		</tr>
	</table>
	<div th:if="${loginAdmin.permissionId == 1}">
		<form th:action="@{/admins/{id}/delete(id=${admindetail.id})}" method="post">
			<input type="hidden" name="_method" value="delete">
			<button type="submit" onclick="return confirm('本当に削除しますか？');">削除</button>
		</form>
	</div>
	<a th:href="@{/admins}">一覧画面へ戻る</a>
</body>

</html>
