<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>メーカー詳細画面</title>
</head>

<body>
	<h1>メーカー詳細画面</h1>
<h2 th:text="${maker.makerName}"></h2>
	<table border="1">
		<tr th:each="item : ${items}">
		    <td th:text="${item.itemName}"></td>
		    <td th:text="${item.smallCategoryName}"></td>
			<td th:text="${#dates.format(item.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
		</tr>
	</table>
	<form th:action="@{/makers/{id}/delete(id=${maker.id})}" method="post">
		<input type="hidden" name="_method" value="delete">
		<button type="submit" onclick="return confirm('本当に削除しますか？');">削除</button>
	</form>
	<a th:href="@{/makers}">一覧画面へ戻る</a>
</body>

</html>
