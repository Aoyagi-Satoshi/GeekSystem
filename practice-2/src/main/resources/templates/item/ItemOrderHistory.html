<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	    <title>商品発注画面</title>
	</head>
	<body>
		<h1>商品発注履歴</h1>

		<table border="1">
			<tr>
				<th>商品ID</th>
				<th>商品名</th>
				<th>発注数</th>
				<th>発注者名</th>
				<th>合計金額</th>
				<th>発注時間</th>
			</tr>

			<tr th:each="history : ${orderHistories}">
				<td th:text="${history.itemId}"></td>
				<td th:text="${history.itemName}"></td>
				<td th:text="${history.orderCount}"></td>
				<td th:text="${history.adminName}"></td>
				<td th:text="${#numbers.formatDecimal(history.totalPrice, 0, 'COMMA', 0, 'POINT')}"></td>
				<td th:text="${#dates.format(history.updatedAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
			</tr>
		</table>

		<a th:href="@{/top}">戻る</a>
	
	</body>
</html>
