<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<title>商品発注確認画面</title>
	</head>
	<body>
		<h1>商品発注確認画面</h1>

		<table border="1">
			<tr>
				<th>商品ID</th>
				<td th:text="${item.id}"></td>
			</tr>
			<tr>
				<th>商品名</th>
				<td th:text="${item.itemName}"></td>
			</tr>

			<tr>
				<th>現在在庫数</th>
				<td th:text="${storeItem.stock}"></td>
			</tr>
			<tr>
				<th>発注数</th>
				<td th:text="${orderForm.orderQuantity}"></td>
			</tr>
			<tr>
				<th>発注後在庫数</th>
				<td th:text="${storeItem.stock + orderForm.orderQuantity}"></td>
			</tr>
		</table>

		<form th:action="@{/item/order}" method="post">
			<button type="submit">発注確定</button>
		</form>

		<a th:href="@{/item/{id}/haccyu(id=${item.id})}">戻る</a>
	</body>
	</html>
